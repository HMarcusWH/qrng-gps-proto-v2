[metadata]
name = qrng-gps-proto
version = 0.1.0
description = Prototype QRNG-anchored GPS/GNSS authentication toolkit
long_description = file: README.md
long_description_content_type = text/markdown
author = QRNG-GPS Contributors
license = MIT
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
package_dir =
    = src
include_package_data = True
python_requires = >=3.8

[options.packages.find]
where = src
